name: Build Android release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RELEASE_KEYSTORE_PATH: app/release-keystore.jks
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Restore release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Build release AAB
        run: gradle bundleRelease --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: random-words-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: random-words-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
